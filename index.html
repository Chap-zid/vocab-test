<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9">
<title>영어Ⅱ 통암기</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#15171a;--muted:#717780;
  --line:#e4e7eb;--accent:#111827;--soft:#f1f3f5;--answer:#f8f9fa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 2px 14px}
h1{font-size:23px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.panel{padding:12px;margin-bottom:12px}
.controls{display:grid;grid-template-columns:1.35fr 1fr .8fr;gap:8px}
.jumpRow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
select,button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px}
select{height:46px;padding:0 10px;min-width:0}
button{cursor:pointer;touch-action:manipulation}
.card{padding:22px 20px;min-height:350px;display:flex;flex-direction:column}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;margin-bottom:20px}
.prompt{font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.8;font-weight:500;word-break:normal}
.blank{display:inline-block;min-width:68px;border-bottom:2px solid #222;text-align:center;color:#a3a8ae;padding:0 3px;margin:0 2px}
.answerBox{display:none;margin-top:22px;padding:18px;border-radius:14px;background:var(--answer);border:1px solid var(--line)}
.answerBox.show{display:block}
.answerTitle{font-size:12px;color:var(--muted);margin-bottom:7px}
.answerText{font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1.75}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:auto;padding-top:24px}
.actions button{height:58px;font-size:16px;font-weight:700}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.secondary{background:#fff}
.foot{margin-top:11px;color:var(--muted);font-size:12px;text-align:center}
.stats{font-size:12px;color:var(--muted);margin-top:9px}

dialog{width:min(860px,calc(100vw - 24px));max-height:86vh;border:1px solid var(--line);border-radius:18px;padding:0;background:#fff;color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.modalHead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.modalTitle{font-weight:800}
.closeBtn{height:40px;padding:0 14px}
.fullText{padding:4px 16px 18px}
.groupTitle{position:sticky;top:69px;background:#fff;padding:16px 0 8px;margin:0;font-size:17px;border-bottom:1px solid var(--line)}
.fullRow{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #eef0f2}
.fullNum{color:var(--muted);font-size:12px;padding-top:4px}
.fullSentence{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.65}
.fullRow.current{background:#fff8db;border-radius:10px;padding-left:8px;padding-right:8px}

@media(max-width:650px){
  .controls{grid-template-columns:1fr 1fr}.controls select:first-child{grid-column:1/-1}
  .jumpRow{grid-template-columns:1fr}
  .card{padding:18px 16px;min-height:430px}.prompt{font-size:20px;line-height:1.78}.answerText{font-size:18px}
  .actions{grid-template-columns:1fr 1fr}.actions .primary{grid-column:1/-1}
  .fullSentence{font-size:17px}.groupTitle{top:66px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>영어Ⅱ 통암기</h1>
    <div class="sub">교과서 본문·Further Reading + 9월 모의고사</div>
  </div>
</header>

<div class="panel">
  <div class="controls">
    <select id="scope"><option value="all">전체</option>
<option value="textbook">교과서 전체</option>
<option value="l1main">1과 본문</option>
<option value="l1fr">1과 Further Reading</option>
<option value="l2main">2과 본문</option>
<option value="l2fr">2과 Further Reading</option>
<option value="mock">9월 모의고사 전체</option>
<option value="mock18">모의고사 18번</option>
<option value="mock19">모의고사 19번</option>
<option value="mock20">모의고사 20번</option>
<option value="mock21">모의고사 21번</option>
<option value="mock22">모의고사 22번</option>
<option value="mock23">모의고사 23번</option>
<option value="mock24">모의고사 24번</option>
<option value="mock26">모의고사 26번</option>
<option value="mock27">모의고사 27번</option>
<option value="mock28">모의고사 28번</option>
<option value="mock29">모의고사 29번</option>
<option value="mock30">모의고사 30번</option>
<option value="mock31">모의고사 31번</option>
<option value="mock32">모의고사 32번</option>
<option value="mock33">모의고사 33번</option>
<option value="mock34">모의고사 34번</option>
<option value="mock35">모의고사 35번</option>
<option value="mock36">모의고사 36번</option>
<option value="mock37">모의고사 37번</option>
<option value="mock38">모의고사 38번</option>
<option value="mock39">모의고사 39번</option>
<option value="mock40">모의고사 40번</option>
<option value="mock41">모의고사 41~42번</option>
<option value="mock43">모의고사 43~45번</option></select>
    <select id="mode">
      <option value="cloze30">빈칸 30%</option>
      <option value="cloze50" selected>빈칸 50%</option>
      <option value="cloze70">빈칸 70%</option>
      <option value="initial">첫 글자만</option>
      <option value="lead">앞부분만</option>
    </select>
    <select id="order">
      <option value="random">무작위</option>
      <option value="seq">순서대로</option>
    </select>
  </div>

  <div class="jumpRow">
    <select id="sentenceSelect" aria-label="문장 선택"></select>
    <button id="fullBtn">원문 전체 보기</button>
  </div>

  <div class="stats"><span id="count"></span> · 답을 누르면 원문만 표시됩니다.</div>
</div>

<div class="card" id="card">
  <div class="meta"><span id="meta"></span><span id="pos"></span></div>
  <div class="prompt" id="prompt"></div>
  <div class="answerBox" id="answerBox">
    <div class="answerTitle">원문</div>
    <div class="answerText" id="answerText"></div>
  </div>
  <div class="actions">
    <button class="secondary" id="prevBtn">이전 문장</button>
    <button class="primary" id="answerBtn">답 보기</button>
    <button class="secondary" id="nextBtn">다음 문장</button>
  </div>
</div>

<div class="foot">문장 선택으로 원하는 위치로 바로 이동할 수 있습니다.</div>
</div>

<dialog id="fullDialog">
  <div class="modalHead">
    <div class="modalTitle" id="fullTitle">원문 전체 보기</div>
    <button class="closeBtn" id="closeFullBtn">닫기</button>
  </div>
  <div class="fullText" id="fullText"></div>
</dialog>

<script>
const DATA=[{"id": "l1main-1", "set": "l1main", "label": "1과 본문", "num": "1", "text": "Imagine an urban area that is fast becoming a slum after an economic recession.", "group": "textbook"}, {"id": "l1main-2", "set": "l1main", "label": "1과 본문", "num": "2", "text": "Businesses close their doors and building owners have left. The area is full of abandoned buildings.", "group": "textbook"}, {"id": "l1main-3", "set": "l1main", "label": "1과 본문", "num": "3", "text": "There is no heating even in winter. Only those who can’t afford to move out remain.", "group": "textbook"}, {"id": "l1main-4", "set": "l1main", "label": "1과 본문", "num": "4", "text": "Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing. Despair is on every street corner.", "group": "textbook"}, {"id": "l1main-5", "set": "l1main", "label": "1과 본문", "num": "5", "text": "One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to unite and create a better community.", "group": "textbook"}, {"id": "l1main-6", "set": "l1main", "label": "1과 본문", "num": "6", "text": "They suggest a peace treaty. “This is for peace, men. The violence took away our brothers. We’re not gangsters anymore. We’ve got to make this town a better place to live.”", "group": "textbook"}, {"id": "l1main-7", "set": "l1main", "label": "1과 본문", "num": "7", "text": "Thanks to these new voices, gang leaders from all over the area sign the treaty. Never again will they use violence to solve their disputes.", "group": "textbook"}, {"id": "l1main-8", "set": "l1main", "label": "1과 본문", "num": "8", "text": "This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace created by African Americans and immigrants.", "group": "textbook"}, {"id": "l1main-9", "set": "l1main", "label": "1과 본문", "num": "9", "text": "The story of hip-hop, now one of the world’s most dominant music genres, is a fascinating one. Let’s explore it.", "group": "textbook"}, {"id": "l1main-10", "set": "l1main", "label": "1과 본문", "num": "10", "text": "DJing, Breakdancing, and MCing After the peace treaty, the gangs that had fought one another started partying together.", "group": "textbook"}, {"id": "l1main-11", "set": "l1main", "label": "1과 본문", "num": "11", "text": "Abandoned buildings and parking lots were used for events called block parties. What eventually emerged from these parties?", "group": "textbook"}, {"id": "l1main-12", "set": "l1main", "label": "1과 본문", "num": "12", "text": "A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. It replaced gang violence with music, dance, art, and style.", "group": "textbook"}, {"id": "l1main-13", "set": "l1main", "label": "1과 본문", "num": "13", "text": "The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop.", "group": "textbook"}, {"id": "l1main-14", "set": "l1main", "label": "1과 본문", "num": "14", "text": "Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique.", "group": "textbook"}, {"id": "l1main-15", "set": "l1main", "label": "1과 본문", "num": "15", "text": "At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break.", "group": "textbook"}, {"id": "l1main-16", "set": "l1main", "label": "1과 본문", "num": "16", "text": "No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc.", "group": "textbook"}, {"id": "l1main-17", "set": "l1main", "label": "1과 본문", "num": "17", "text": "Kool Herc’s style of DJing quickly became influential in the rise of hip-hop music and breakdancing.", "group": "textbook"}, {"id": "l1main-18", "set": "l1main", "label": "1과 본문", "num": "18", "text": "The break section became the most anticipated part of a song. People would form dancer circles and use the break to show off their individual dancing skills.", "group": "textbook"}, {"id": "l1main-19", "set": "l1main", "label": "1과 본문", "num": "19", "text": "Kool Herc named the people dancing to his music B-Boys and B-Girls, short for Break-Boys and Break-Girls.", "group": "textbook"}, {"id": "l1main-20", "set": "l1main", "label": "1과 본문", "num": "20", "text": "These people began to dance in groups in the streets and build a street dance battle culture.", "group": "textbook"}, {"id": "l1main-21", "set": "l1main", "label": "1과 본문", "num": "21", "text": "DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd.", "group": "textbook"}, {"id": "l1main-22", "set": "l1main", "label": "1과 본문", "num": "22", "text": "They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing.", "group": "textbook"}, {"id": "l1main-23", "set": "l1main", "label": "1과 본문", "num": "23", "text": "When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties. This separate role became MCing.", "group": "textbook"}, {"id": "l1main-24", "set": "l1main", "label": "1과 본문", "num": "24", "text": "The Origin of the Word Hip-Hop Then where did the word hip-hop originate from?", "group": "textbook"}, {"id": "l1main-25", "set": "l1main", "label": "1과 본문", "num": "25", "text": "Nobody knows the exact origin, but it is said that the word hip-hop was first used at a block party. A young man at the party was about to join the army.", "group": "textbook"}, {"id": "l1main-26", "set": "l1main", "label": "1과 본문", "num": "26", "text": "His good friend, the MC of the party, reminded him in a jokey way that his days of freedom were over by moving across the stage like a military instructor to the beat, chanting, “Hip-hop-hip-hop-hip-hop.”", "group": "textbook"}, {"id": "l1main-27", "set": "l1main", "label": "1과 본문", "num": "27", "text": "The crowd loved it. After that, MCs tried out new lines at parties like “Hip, hop, hippy to the hippy hop-bop,” “I said a hip-hop, a hibbit, hibby-dibby, hip-hip-hop and you don’t stop.”", "group": "textbook"}, {"id": "l1main-28", "set": "l1main", "label": "1과 본문", "num": "28", "text": "Such lines became a standard part of rap and were included in the lyrics of the first recorded hip-hop album, Rapper’s Delight (1979), which was an immediate success.", "group": "textbook"}, {"id": "l1main-29", "set": "l1main", "label": "1과 본문", "num": "29", "text": "The new music and dancing spread very fast. There was a sharp unexplained decline in violence during the 1980s in New York.", "group": "textbook"}, {"id": "l1main-30", "set": "l1main", "label": "1과 본문", "num": "30", "text": "One police officer asked a boy on the street if he knew why. The boy said, “It’s because they’re dancing.”", "group": "textbook"}, {"id": "l1main-31", "set": "l1main", "label": "1과 본문", "num": "31", "text": "The Messages of Hip-Hop Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper.", "group": "textbook"}, {"id": "l1main-32", "set": "l1main", "label": "1과 본문", "num": "32", "text": "However, a significant shift occurred during the rise of hip-hop music in the 1980s.", "group": "textbook"}, {"id": "l1main-33", "set": "l1main", "label": "1과 본문", "num": "33", "text": "Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking.", "group": "textbook"}, {"id": "l1main-34", "set": "l1main", "label": "1과 본문", "num": "34", "text": "This song’s powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen.", "group": "textbook"}, {"id": "l1main-35", "set": "l1main", "label": "1과 본문", "num": "35", "text": "With this song, hip-hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice.", "group": "textbook"}, {"id": "l1main-36", "set": "l1main", "label": "1과 본문", "num": "36", "text": "The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s.", "group": "textbook"}, {"id": "l1main-37", "set": "l1main", "label": "1과 본문", "num": "37", "text": "At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat.", "group": "textbook"}, {"id": "l1main-38", "set": "l1main", "label": "1과 본문", "num": "38", "text": "Also, a new attitude gradually emerged in hip-hop lyrics, which can be summarized as “respect.”", "group": "textbook"}, {"id": "l1main-39", "set": "l1main", "label": "1과 본문", "num": "39", "text": "Hip-hop music began to be a way to express respect for one another, and particularly for hip-hop pioneers.", "group": "textbook"}, {"id": "l1main-40", "set": "l1main", "label": "1과 본문", "num": "40", "text": "For rappers, the pioneers are heroes who overcame hardship and injustice and went on to create new music and culture.", "group": "textbook"}, {"id": "l1main-41", "set": "l1main", "label": "1과 본문", "num": "41", "text": "Therefore, many hip-hoppers agree that they cannot have too much respect for these heroes.", "group": "textbook"}, {"id": "l1main-42", "set": "l1main", "label": "1과 본문", "num": "42", "text": "The phrase “something from nothing,” often used to summarize the genre’s history, is also an expression of admiration for early hip-hoppers, who developed a new culture in the ghetto despite very limited resources.", "group": "textbook"}, {"id": "l1main-43", "set": "l1main", "label": "1과 본문", "num": "43", "text": "Rappers also proudly expressed their feeling that they, too, and perhaps the audience, had suffered and survived in a similar way to the pioneers.", "group": "textbook"}, {"id": "l1main-44", "set": "l1main", "label": "1과 본문", "num": "44", "text": "This is why the message of respect is about both self-worth and respect for others. The importance of the idea of respect in hip-hop cannot be emphasized strongly enough.", "group": "textbook"}, {"id": "l1main-45", "set": "l1main", "label": "1과 본문", "num": "45", "text": "Hip-Hop in the 21st Century “The HipHop Declaration of Peace,” presented to the UN on May 16th, 2001, officially recognized hip-hop as an international culture of peace.", "group": "textbook"}, {"id": "l1main-46", "set": "l1main", "label": "1과 본문", "num": "46", "text": "This document reminds us of hip-hop’s original mission to bring peace to the Bronx, implying global respect for hip-hop history.", "group": "textbook"}, {"id": "l1main-47", "set": "l1main", "label": "1과 본문", "num": "47", "text": "When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018, it was another important event.", "group": "textbook"}, {"id": "l1main-48", "set": "l1main", "label": "1과 본문", "num": "48", "text": "It meant that hip-hop, which started as underground music, had become a major art form like classical music.", "group": "textbook"}, {"id": "l1main-49", "set": "l1main", "label": "1과 본문", "num": "49", "text": "If hip-hop music was born as part of a cultural movement for peace in the 1970s, today more and more people regard it as a powerful means to express oneself, fight against injustice, bring about change through social messages, and still be engaged with music and connected to others.", "group": "textbook"}, {"id": "l1main-50", "set": "l1main", "label": "1과 본문", "num": "50", "text": "With its unique and growing appeal, hip-hop continues to be a global phenomenon.", "group": "textbook"}, {"id": "l1fr-1", "set": "l1fr", "label": "1과 Further Reading", "num": "1", "text": "A rhyme is usually the repetition of the final sound of a word.", "group": "textbook"}, {"id": "l1fr-2", "set": "l1fr", "label": "1과 Further Reading", "num": "2", "text": "Most often, it is consciously used for a musical effect in the final position of lines within poems or songs. Let’s look at three ways that rhyme is used in rap lyrics.", "group": "textbook"}, {"id": "l1fr-3", "set": "l1fr", "label": "1과 Further Reading", "num": "3", "text": "First, if two lines finish with words that rhyme, this is called an end rhyme, which is the most representative kind of rhyme.", "group": "textbook"}, {"id": "l1fr-4", "set": "l1fr", "label": "1과 Further Reading", "num": "4", "text": "Try reading the following example aloud. My house is so big you cannot see the top Don’t jump off the roof that is quite a long drop", "group": "textbook"}, {"id": "l1fr-5", "set": "l1fr", "label": "1과 Further Reading", "num": "5", "text": "The two rhyming words ”top“ and ”drop“ share an ending sound ”op.“", "group": "textbook"}, {"id": "l1fr-6", "set": "l1fr", "label": "1과 Further Reading", "num": "6", "text": "Second, words can rhyme within the same line. This creates an internal rhyme, which involves a word in the middle of a line and another word in the same or the next line.", "group": "textbook"}, {"id": "l1fr-7", "set": "l1fr", "label": "1과 Further Reading", "num": "7", "text": "For example, ‘They’re never gonna learn how to wait their turn‘", "group": "textbook"}, {"id": "l1fr-8", "set": "l1fr", "label": "1과 Further Reading", "num": "8", "text": "Third, rappers often use imperfect rhymes. For example, ”start,“ ”sport,“ and ”straight“ do not exactly rhyme, but they create a pattern of similar sounds /s/ and /t/.", "group": "textbook"}, {"id": "l1fr-9", "set": "l1fr", "label": "1과 Further Reading", "num": "9", "text": "In most imperfect rhymes, the consonants are identical while the vowel sounds are different, or the other way round.", "group": "textbook"}, {"id": "l1fr-10", "set": "l1fr", "label": "1과 Further Reading", "num": "10", "text": "When a sequence of rhymed words is spoken aloud, it creates a rhythmic pattern or ”flow.“", "group": "textbook"}, {"id": "l1fr-11", "set": "l1fr", "label": "1과 Further Reading", "num": "11", "text": "This helps the song keep a steady beat, pleases the ear, and evokes emotions.", "group": "textbook"}, {"id": "l1fr-12", "set": "l1fr", "label": "1과 Further Reading", "num": "12", "text": "So, if you create a rap, rhyming is a great way to make your voice stronger and reach your listeners.", "group": "textbook"}, {"id": "l2main-1", "set": "l2main", "label": "2과 본문", "num": "1", "text": "Jiyun, a high school student, starts her day by logging in to a music streaming service on her smartphone.", "group": "textbook"}, {"id": "l2main-2", "set": "l2main", "label": "2과 본문", "num": "2", "text": "She enjoys listening to her favorite music, discovering new songs, and exploring new artists every day.", "group": "textbook"}, {"id": "l2main-3", "set": "l2main", "label": "2과 본문", "num": "3", "text": "For a healthy breakfast, Jiyun receives a delivery from a subscription service that provides fresh vegetables and fruits.", "group": "textbook"}, {"id": "l2main-4", "set": "l2main", "label": "2과 본문", "num": "4", "text": "After school, Jiyun utilizes a video lecture service to expand her knowledge in whatever she finds interesting.", "group": "textbook"}, {"id": "l2main-5", "set": "l2main", "label": "2과 본문", "num": "5", "text": "For example, she watches various academic lectures to review her schoolwork and stay updated about the latest knowledge in her chosen field of study.", "group": "textbook"}, {"id": "l2main-6", "set": "l2main", "label": "2과 본문", "num": "6", "text": "During weekends, Jiyun and her family spend quality time together watching movies or dramas using a streaming service.", "group": "textbook"}, {"id": "l2main-7", "set": "l2main", "label": "2과 본문", "num": "7", "text": "Subscriptions are everywhere To be sure, the subscription economy is a popular economic model nowadays, and Jiyun is actively taking part in it.", "group": "textbook"}, {"id": "l2main-8", "set": "l2main", "label": "2과 본문", "num": "8", "text": "The concept of business models based on subscriptions is not new. Initially it was limited to products such as milk and newspapers.", "group": "textbook"}, {"id": "l2main-9", "set": "l2main", "label": "2과 본문", "num": "9", "text": "However, these business models have expanded to all industries, including entertainment, technology, fashion, education, and much more.", "group": "textbook"}, {"id": "l2main-10", "set": "l2main", "label": "2과 본문", "num": "10", "text": "Instead of creating a hit product that will be sold once, companies now prioritize providing continuing value, such as new content, more personalization, or access to updates.", "group": "textbook"}, {"id": "l2main-11", "set": "l2main", "label": "2과 본문", "num": "11", "text": "Customers pay for these benefits via a regular subscription.", "group": "textbook"}, {"id": "l2main-12", "set": "l2main", "label": "2과 본문", "num": "12", "text": "The subscription economy brings advantages for both companies and consumers.", "group": "textbook"}, {"id": "l2main-13", "set": "l2main", "label": "2과 본문", "num": "13", "text": "Companies can have a stable revenue and build customer loyalty by using the subscription model.", "group": "textbook"}, {"id": "l2main-14", "set": "l2main", "label": "2과 본문", "num": "14", "text": "From the consumers’ perspective, they can enjoy a wider range of choices and personalized experiences.", "group": "textbook"}, {"id": "l2main-15", "set": "l2main", "label": "2과 본문", "num": "15", "text": "They can also save money by having flexible subscription contracts.", "group": "textbook"}, {"id": "l2main-16", "set": "l2main", "label": "2과 본문", "num": "16", "text": "The rise of the subscription economy is closely connected to two major drivers: changes in consumption trends and the rapid growth of online platforms.", "group": "textbook"}, {"id": "l2main-17", "set": "l2main", "label": "2과 본문", "num": "17", "text": "People love the subscriptions The subscription economy is highly relevant to how people consume goods and services nowadays.", "group": "textbook"}, {"id": "l2main-18", "set": "l2main", "label": "2과 본문", "num": "18", "text": "More and more people prioritize experiences over owning things.", "group": "textbook"}, {"id": "l2main-19", "set": "l2main", "label": "2과 본문", "num": "19", "text": "This makes the subscription economy attractive to them because it offers access to services or content without the requirement of ownership.", "group": "textbook"}, {"id": "l2main-20", "set": "l2main", "label": "2과 본문", "num": "20", "text": "For example, by subscribing to a music streaming service, consumers can enjoy limitless music without the need for having disc albums.", "group": "textbook"}, {"id": "l2main-21", "set": "l2main", "label": "2과 본문", "num": "21", "text": "Another example is subscribing to clothing services, where consumers can explore a variety of clothing styles without filling up their drawers.", "group": "textbook"}, {"id": "l2main-22", "set": "l2main", "label": "2과 본문", "num": "22", "text": "Moreover, consumers value diversity and customization.", "group": "textbook"}, {"id": "l2main-23", "set": "l2main", "label": "2과 본문", "num": "23", "text": "The subscription economy offers a diverse range of subscription options, enabling individuals to personalize their experiences based on their own preferences and interests.", "group": "textbook"}, {"id": "l2main-24", "set": "l2main", "label": "2과 본문", "num": "24", "text": "This aspect of the subscription economy is more popular among younger generations, as they enjoy expressing their uniqueness and discovering valuable content and services that fit with their individual tastes.", "group": "textbook"}, {"id": "l2main-25", "set": "l2main", "label": "2과 본문", "num": "25", "text": "A popular example that has gained attention is the cosmetics subscription service.", "group": "textbook"}, {"id": "l2main-26", "set": "l2main", "label": "2과 본문", "num": "26", "text": "It stands out by thoroughly analyzing customers’ current skin conditions and providing specialized recommendations, including manufacturing cosmetics created to address each individual’s unique skin concerns.", "group": "textbook"}, {"id": "l2main-27", "set": "l2main", "label": "2과 본문", "num": "27", "text": "To come to the point, consumers receive a personalized experience that prioritizes their individual skin conditions, rather than a uniform purchasing process.", "group": "textbook"}, {"id": "l2main-28", "set": "l2main", "label": "2과 본문", "num": "28", "text": "Furthermore, consumers appreciate flexibility and convenience.", "group": "textbook"}, {"id": "l2main-29", "set": "l2main", "label": "2과 본문", "num": "29", "text": "In some subscription models, consumers can experience a variety of products or services for a fixed cost.", "group": "textbook"}, {"id": "l2main-30", "set": "l2main", "label": "2과 본문", "num": "30", "text": "In other models, they can flexibly adjust subscription fees by choosing only the necessary services or products when needed.", "group": "textbook"}, {"id": "l2main-31", "set": "l2main", "label": "2과 본문", "num": "31", "text": "This means they can either enjoy a range of offerings for a set price or save money by selecting only what they really need.", "group": "textbook"}, {"id": "l2main-32", "set": "l2main", "label": "2과 본문", "num": "32", "text": "Moreover, subscription services are made easily accessible by online platforms, enhancing consumers’ convenience.", "group": "textbook"}, {"id": "l2main-33", "set": "l2main", "label": "2과 본문", "num": "33", "text": "With just a few clicks, consumers can receive services or products. If they wish to change their device model, they can do so.", "group": "textbook"}, {"id": "l2main-34", "set": "l2main", "label": "2과 본문", "num": "34", "text": "Whoever desires an upgrade can get it and experience the latest models.", "group": "textbook"}, {"id": "l2main-35", "set": "l2main", "label": "2과 본문", "num": "35", "text": "Online platforms drive the subscription economy With the development of various digital devices centered on smartphones, consumers have been able to do numerous things with great ease.", "group": "textbook"}, {"id": "l2main-36", "set": "l2main", "label": "2과 본문", "num": "36", "text": "In the past, people had no choice but to go to the theater or purchase the videos they wanted to watch.", "group": "textbook"}, {"id": "l2main-37", "set": "l2main", "label": "2과 본문", "num": "37", "text": "Today, whoever wants to watch a movie can access online media subscription platforms and enjoy a vast selection of movies on their smartphones or other digital devices.", "group": "textbook"}, {"id": "l2main-38", "set": "l2main", "label": "2과 본문", "num": "38", "text": "At the same time, these platforms make it easy for companies to offer customized products and services to customers.", "group": "textbook"}, {"id": "l2main-39", "set": "l2main", "label": "2과 본문", "num": "39", "text": "By applying AI and big data algorithm technology, companies identify consumers’ needs, tastes, and consumption patterns.", "group": "textbook"}, {"id": "l2main-40", "set": "l2main", "label": "2과 본문", "num": "40", "text": "People appreciate having diverse choices and customization, which in turn enhances their satisfaction.", "group": "textbook"}, {"id": "l2main-41", "set": "l2main", "label": "2과 본문", "num": "41", "text": "Services, such as suggesting personalized clothing styles based on customers’ purchase history or recommending videos that match their movie and video viewing history, bring them great satisfaction.", "group": "textbook"}, {"id": "l2main-42", "set": "l2main", "label": "2과 본문", "num": "42", "text": "Limitations of the subscription economy Although the subscription economy offers many advantages, there are also some disadvantages to consider. One concern is the potential for overconsumption.", "group": "textbook"}, {"id": "l2main-43", "set": "l2main", "label": "2과 본문", "num": "43", "text": "The convenience and accessibility of the subscription model make it easy for consumers to sign up for multiple services and use a lot of content or products.", "group": "textbook"}, {"id": "l2main-44", "set": "l2main", "label": "2과 본문", "num": "44", "text": "This can result in excessive consumption and using more subscription services than actually needed.", "group": "textbook"}, {"id": "l2main-45", "set": "l2main", "label": "2과 본문", "num": "45", "text": "It is crucial to subscribe only to services that are truly necessary and avoid subscribing to similar services.", "group": "textbook"}, {"id": "l2main-46", "set": "l2main", "label": "2과 본문", "num": "46", "text": "Related to the concern of overconsumption is the financial burden that subscriptions can create.", "group": "textbook"}, {"id": "l2main-47", "set": "l2main", "label": "2과 본문", "num": "47", "text": "While the cost of individual subscriptions may seem affordable, subscribing to multiple services can add up quickly.", "group": "textbook"}, {"id": "l2main-48", "set": "l2main", "label": "2과 본문", "num": "48", "text": "It is important to carefully consider the costs of these subscriptions to avoid financial strain.", "group": "textbook"}, {"id": "l2main-49", "set": "l2main", "label": "2과 본문", "num": "49", "text": "Regularly reviewing and canceling unnecessary subscriptions can be beneficial.", "group": "textbook"}, {"id": "l2main-50", "set": "l2main", "label": "2과 본문", "num": "50", "text": "Additionally, the subscription economy can contribute to environmental pollution.", "group": "textbook"}, {"id": "l2main-51", "set": "l2main", "label": "2과 본문", "num": "51", "text": "The regular delivery of products in packaging materials can increase the use of disposable packaging, which harms the environment.", "group": "textbook"}, {"id": "l2main-52", "set": "l2main", "label": "2과 본문", "num": "52", "text": "Using environmentally friendly packaging materials and opting for reusable packaging can help reduce this problem.", "group": "textbook"}, {"id": "l2main-53", "set": "l2main", "label": "2과 본문", "num": "53", "text": "Despite the potential limitations of subscription services, they have become deeply embedded in our lives and more and more businesses are jumping onto the subscription economy model.", "group": "textbook"}, {"id": "l2main-54", "set": "l2main", "label": "2과 본문", "num": "54", "text": "It is expected that new subscription services will be continuously provided to consumers in new areas in the future.", "group": "textbook"}, {"id": "l2main-55", "set": "l2main", "label": "2과 본문", "num": "55", "text": "We need to have a deeper understanding of the subscription economy and become wise consumers who receive the services that are really needed.", "group": "textbook"}, {"id": "l2fr-1", "set": "l2fr", "label": "2과 Further Reading", "num": "1", "text": "A long-term study conducted by Thomas Gilovich, a psychology professor at Cornell University, reached a powerful and clear conclusion: Don’t spend your money on things.", "group": "textbook"}, {"id": "l2fr-2", "set": "l2fr", "label": "2과 Further Reading", "num": "2", "text": "We assume that the happiness we get from buying something will last as long as the thing itself. But it’s wrong.", "group": "textbook"}, {"id": "l2fr-3", "set": "l2fr", "label": "2과 Further Reading", "num": "3", "text": "The trouble with things is that the happiness they provide fades quickly. There are three critical reasons for this.", "group": "textbook"}, {"id": "l2fr-4", "set": "l2fr", "label": "2과 Further Reading", "num": "4", "text": "First, we get used to new possessions. What once seemed novel and exciting quickly becomes the norm.", "group": "textbook"}, {"id": "l2fr-5", "set": "l2fr", "label": "2과 Further Reading", "num": "5", "text": "Second, we keep raising the bar. New purchases lead to new expectations.", "group": "textbook"}, {"id": "l2fr-6", "set": "l2fr", "label": "2과 Further Reading", "num": "6", "text": "As soon as we get used to a new possession, we look for an even better one.", "group": "textbook"}, {"id": "l2fr-7", "set": "l2fr", "label": "2과 Further Reading", "num": "7", "text": "Third, possessions stimulate humans to compare themselves with others.", "group": "textbook"}, {"id": "l2fr-8", "set": "l2fr", "label": "2과 Further Reading", "num": "8", "text": "We buy a new car and are thrilled with it until a friend buys a better one, and there’s always someone with a better one.", "group": "textbook"}, {"id": "l2fr-9", "set": "l2fr", "label": "2과 Further Reading", "num": "9", "text": "Gilovich and other researchers have found that experiences deliver longer lasting happiness than things.", "group": "textbook"}, {"id": "l2fr-10", "set": "l2fr", "label": "2과 Further Reading", "num": "10", "text": "That’s because experiences become a part of our identity.", "group": "textbook"}, {"id": "l2fr-11", "set": "l2fr", "label": "2과 Further Reading", "num": "11", "text": "We are not our possessions, but we are the accumulation of everything we’ve seen, the things we’ve done, and the places we’ve been to.", "group": "textbook"}, {"id": "l2fr-12", "set": "l2fr", "label": "2과 Further Reading", "num": "12", "text": "“Our experiences are a bigger part of ourselves than our material goods,” says Gilovich.", "group": "textbook"}, {"id": "l2fr-13", "set": "l2fr", "label": "2과 Further Reading", "num": "13", "text": "“You can really like your material stuff. You can even think that part of your identity is connected to those things, but nonetheless they remain separate from you. On the other hand, your experiences really are part of you. We are the sum total of our experiences.”", "group": "textbook"}, {"id": "mock-18-1", "set": "mock18", "label": "9월 모의고사 18번", "num": "1", "text": "To whom it may concern, I am a teacher at Pendington High School, and we are currently preparing a new school promotional brochure.", "group": "mock"}, {"id": "mock-18-2", "set": "mock18", "label": "9월 모의고사 18번", "num": "2", "text": "As we wish to update the overall design of our brochure, we are considering working with a new printing company.", "group": "mock"}, {"id": "mock-18-3", "set": "mock18", "label": "9월 모의고사 18번", "num": "3", "text": "While reviewing several options, we felt that your design style and printing formats seemed to suit our needs well.", "group": "mock"}, {"id": "mock-18-4", "set": "mock18", "label": "9월 모의고사 18번", "num": "4", "text": "We intend to make a four-paged brochure and print 500 copies in full color.", "group": "mock"}, {"id": "mock-18-5", "set": "mock18", "label": "9월 모의고사 18번", "num": "5", "text": "Before proceeding, we would like to ask you how much it would cost.", "group": "mock"}, {"id": "mock-18-6", "set": "mock18", "label": "9월 모의고사 18번", "num": "6", "text": "This will greatly help us in setting our budget and schedule more effectively.", "group": "mock"}, {"id": "mock-18-7", "set": "mock18", "label": "9월 모의고사 18번", "num": "7", "text": "Thank you very much for your time and assistance.", "group": "mock"}, {"id": "mock-18-8", "set": "mock18", "label": "9월 모의고사 18번", "num": "8", "text": "I look forward to your response.", "group": "mock"}, {"id": "mock-18-9", "set": "mock18", "label": "9월 모의고사 18번", "num": "9", "text": "Sincerely, Sarah Clayton", "group": "mock"}, {"id": "mock-19-1", "set": "mock19", "label": "9월 모의고사 19번", "num": "1", "text": "I ran into the music room, breathing heavily.", "group": "mock"}, {"id": "mock-19-2", "set": "mock19", "label": "9월 모의고사 19번", "num": "2", "text": "The rest of the band were sitting with long faces.", "group": "mock"}, {"id": "mock-19-3", "set": "mock19", "label": "9월 모의고사 19번", "num": "3", "text": "Immy looked up at me and shook her head.", "group": "mock"}, {"id": "mock-19-4", "set": "mock19", "label": "9월 모의고사 19번", "num": "4", "text": "I sank into a chair.", "group": "mock"}, {"id": "mock-19-5", "set": "mock19", "label": "9월 모의고사 19번", "num": "5", "text": "I had truly believed we would make it; our audition had been flawless.", "group": "mock"}, {"id": "mock-19-6", "set": "mock19", "label": "9월 모의고사 19번", "num": "6", "text": "My chest felt heavy as I asked, “So, who won?” I was holding back my tears.", "group": "mock"}, {"id": "mock-19-7", "set": "mock19", "label": "9월 모의고사 19번", "num": "7", "text": "“A band called A Happy Accident.", "group": "mock"}, {"id": "mock-19-8", "set": "mock19", "label": "9월 모의고사 19번", "num": "8", "text": "They were quite good,” she said calmly.", "group": "mock"}, {"id": "mock-19-9", "set": "mock19", "label": "9월 모의고사 19번", "num": "9", "text": "A moment later, a big smile spread across Immy’s face, and the others began to cheer.", "group": "mock"}, {"id": "mock-19-10", "set": "mock19", "label": "9월 모의고사 19번", "num": "10", "text": "“Wait, what?", "group": "mock"}, {"id": "mock-19-11", "set": "mock19", "label": "9월 모의고사 19번", "num": "11", "text": "That’s us!” I said.", "group": "mock"}, {"id": "mock-19-12", "set": "mock19", "label": "9월 모의고사 19번", "num": "12", "text": "Immy laughed and said, “Since you were late, we decided to play a joke on you!", "group": "mock"}, {"id": "mock-19-13", "set": "mock19", "label": "9월 모의고사 19번", "num": "13", "text": "We made it!” I was filled with joy.", "group": "mock"}, {"id": "mock-19-14", "set": "mock19", "label": "9월 모의고사 19번", "num": "14", "text": "We jumped up and hugged each other.", "group": "mock"}, {"id": "mock-19-15", "set": "mock19", "label": "9월 모의고사 19번", "num": "15", "text": "My heart was racing with excitement.", "group": "mock"}, {"id": "mock-20-1", "set": "mock20", "label": "9월 모의고사 20번", "num": "1", "text": "Only when you’re happy that you’ve done the best you can for your story should you show it to someone else.", "group": "mock"}, {"id": "mock-20-2", "set": "mock20", "label": "9월 모의고사 20번", "num": "2", "text": "You may well want to show it to your nearest and dearest, and that’s fine, but in most cases you shouldn’t look to their reading for any great benefit to your work.", "group": "mock"}, {"id": "mock-20-3", "set": "mock20", "label": "9월 모의고사 20번", "num": "3", "text": "The most valuable feedback is likely to come from other sources: you should choose readers for their critical insight, not their closeness to you.", "group": "mock"}, {"id": "mock-20-4", "set": "mock20", "label": "9월 모의고사 20번", "num": "4", "text": "Fellow writers are ideal, but don’t imagine that any writer will do.", "group": "mock"}, {"id": "mock-20-5", "set": "mock20", "label": "9월 모의고사 20번", "num": "5", "text": "If you are part of a writers’ circle or class, you’ll know whose writing you admire, and if you’ve had feedback in the past you’ll know whose opinions have been helpful — and whose have not.", "group": "mock"}, {"id": "mock-21-1", "set": "mock21", "label": "9월 모의고사 21번", "num": "1", "text": "A meeting in a flexible-time culture like those found in South America, parts of Europe, Africa, and the Middle East is more like an evergreen tree.", "group": "mock"}, {"id": "mock-21-2", "set": "mock21", "label": "9월 모의고사 21번", "num": "2", "text": "An agenda with a meeting start time and a topic will probably be circulated before the meeting.", "group": "mock"}, {"id": "mock-21-3", "set": "mock21", "label": "9월 모의고사 21번", "num": "3", "text": "This will serve as the trunk of the tree.", "group": "mock"}, {"id": "mock-21-4", "set": "mock21", "label": "9월 모의고사 21번", "num": "4", "text": "But there’s no expectation that the meeting will progress in a linear manner.", "group": "mock"}, {"id": "mock-21-5", "set": "mock21", "label": "9월 모의고사 21번", "num": "5", "text": "What seemed like a priority last week when the agenda was crafted is not necessarily the priority right now — so discussion may branch off in a new direction.", "group": "mock"}, {"id": "mock-21-6", "set": "mock21", "label": "9월 모의고사 21번", "num": "6", "text": "Other branches may sprout as some members have urgent phone calls that take them in and out of the meeting.", "group": "mock"}, {"id": "mock-21-7", "set": "mock21", "label": "9월 모의고사 21번", "num": "7", "text": "Or sub-groups may form within the room to discuss timely subjects linked in some way to the main meeting trunk.", "group": "mock"}, {"id": "mock-21-8", "set": "mock21", "label": "9월 모의고사 21번", "num": "8", "text": "In flexible-time cultures, it seems clear that the most productive meetings grow in unpredictable ways, and the effective manager is flexible and professional enough to capitalize on priorities and changing needs as they arise.", "group": "mock"}, {"id": "mock-21-9", "set": "mock21", "label": "9월 모의고사 21번", "num": "9", "text": "Interruptions, agenda changes, and frequent shifts in direction are seen as natural and necessary.", "group": "mock"}, {"id": "mock-22-1", "set": "mock22", "label": "9월 모의고사 22번", "num": "1", "text": "When we are ‘always on’ we are constantly ingesting content — reading alerts and texts, liking, checking emails, downloading, uploading, upgrading, updating, deleting, submitting responses, and posting.", "group": "mock"}, {"id": "mock-22-2", "set": "mock22", "label": "9월 모의고사 22번", "num": "2", "text": "If we do it while we are eating, our multi-tasking is overloading us.", "group": "mock"}, {"id": "mock-22-3", "set": "mock22", "label": "9월 모의고사 22번", "num": "3", "text": "As our will attempts to digest the virtual content its forces are diverted from the physical content, our food.", "group": "mock"}, {"id": "mock-22-4", "set": "mock22", "label": "9월 모의고사 22번", "num": "4", "text": "It’s easy to eat a sandwich in a minute while talking on the phone.", "group": "mock"}, {"id": "mock-22-5", "set": "mock22", "label": "9월 모의고사 22번", "num": "5", "text": "Some people are skilled at doing both at the same time.", "group": "mock"}, {"id": "mock-22-6", "set": "mock22", "label": "9월 모의고사 22번", "num": "6", "text": "Others write a half-hearted, shorthand text while they hurriedly eat their sandwich at the same time.", "group": "mock"}, {"id": "mock-22-7", "set": "mock22", "label": "9월 모의고사 22번", "num": "7", "text": "The result can be a misunderstood text with the need for further clarifying texts and the beginnings of nervous indigestion.", "group": "mock"}, {"id": "mock-22-8", "set": "mock22", "label": "9월 모의고사 22번", "num": "8", "text": "Eat your sandwich.", "group": "mock"}, {"id": "mock-22-9", "set": "mock22", "label": "9월 모의고사 22번", "num": "9", "text": "Taste it.", "group": "mock"}, {"id": "mock-22-10", "set": "mock22", "label": "9월 모의고사 22번", "num": "10", "text": "Let it go down.", "group": "mock"}, {"id": "mock-22-11", "set": "mock22", "label": "9월 모의고사 22번", "num": "11", "text": "Then text. *ingest: 섭취하다", "group": "mock"}, {"id": "mock-23-1", "set": "mock23", "label": "9월 모의고사 23번", "num": "1", "text": "Music can bring us into a very comfortable rhythm, and it can be satisfying in and of itself.", "group": "mock"}, {"id": "mock-23-2", "set": "mock23", "label": "9월 모의고사 23번", "num": "2", "text": "Most of the time, however, we want something more to happen.", "group": "mock"}, {"id": "mock-23-3", "set": "mock23", "label": "9월 모의고사 23번", "num": "3", "text": "There needs to be a process that creates tension and drives the movement towards something in particular.", "group": "mock"}, {"id": "mock-23-4", "set": "mock23", "label": "9월 모의고사 23번", "num": "4", "text": "The excitement that arises in this process creates satisfaction and pleasure.", "group": "mock"}, {"id": "mock-23-5", "set": "mock23", "label": "9월 모의고사 23번", "num": "5", "text": "This is seen in the measureless prelude as well.", "group": "mock"}, {"id": "mock-23-6", "set": "mock23", "label": "9월 모의고사 23번", "num": "6", "text": "But there the tension might be caused by the ambiguity of the rhythm.", "group": "mock"}, {"id": "mock-23-7", "set": "mock23", "label": "9월 모의고사 23번", "num": "7", "text": "Therefore, the fluid movement in the prelude usually creates a tension that can be released in the subsequent movement with a set rhythm.", "group": "mock"}, {"id": "mock-23-8", "set": "mock23", "label": "9월 모의고사 23번", "num": "8", "text": "This, in turn, creates new and other types of tensions, where the rhythm is unambiguous and predictable, but where unexpected chords and modulations create drama and an experience of development in the piece.", "group": "mock"}, {"id": "mock-24-1", "set": "mock24", "label": "9월 모의고사 24번", "num": "1", "text": "Progressive educators and librarians are developing curricula to teach what we might call attention literacy.", "group": "mock"}, {"id": "mock-24-2", "set": "mock24", "label": "9월 모의고사 24번", "num": "2", "text": "This means helping students recognize, for example, how the architecture of a social media feed or a news site is deliberately designed to distract or provoke them.", "group": "mock"}, {"id": "mock-24-3", "set": "mock24", "label": "9월 모의고사 24번", "num": "3", "text": "Classes in media literacy traditionally cover how to evaluate the credibility of sources — now they also include recognizing clickbait, understanding the role of algorithms in what content is served up, and observing one’s own patterns of distraction.", "group": "mock"}, {"id": "mock-24-4", "set": "mock24", "label": "9월 모의고사 24번", "num": "4", "text": "A student might be tasked with tracking how many times they switch tasks or check their phone in an hour of homework, to raise self-awareness about fragmentation.", "group": "mock"}, {"id": "mock-24-5", "set": "mock24", "label": "9월 모의고사 24번", "num": "5", "text": "Another lesson might involve unpacking the design of popular apps: Why does an app use infinite scrolling instead of pages?", "group": "mock"}, {"id": "mock-24-6", "set": "mock24", "label": "9월 모의고사 24번", "num": "6", "text": "Why do notifications appear with specific colors and sounds?", "group": "mock"}, {"id": "mock-24-7", "set": "mock24", "label": "9월 모의고사 24번", "num": "7", "text": "By treating these as deliberate design choices (often rooted in psychology and profit motives), young people become more critical users rather than passive consumers.", "group": "mock"}, {"id": "mock-26-1", "set": "mock26", "label": "9월 모의고사 26번", "num": "1", "text": "Frederick Law Olmsted, known as the father of American landscape architecture, was born in 1822.", "group": "mock"}, {"id": "mock-26-2", "set": "mock26", "label": "9월 모의고사 26번", "num": "2", "text": "When Olmsted was young, he often went on trips to the countryside with his father, who loved scenery.", "group": "mock"}, {"id": "mock-26-3", "set": "mock26", "label": "9월 모의고사 26번", "num": "3", "text": "At age 14, he was preparing himself to study at Yale College, but he could not enter due to a severe sumac poisoning that damaged his eyesight.", "group": "mock"}, {"id": "mock-26-4", "set": "mock26", "label": "9월 모의고사 26번", "num": "4", "text": "Instead of attending a college, he gained experience working as a clerk, a sailor, and a farmer.", "group": "mock"}, {"id": "mock-26-5", "set": "mock26", "label": "9월 모의고사 26번", "num": "5", "text": "In 1858, he worked with Calvert Vaux and won the design competition for New York City’s Central Park with the “Greensward Plan.” During the Civil War, Olmsted served as General Secretary of the United States Sanitary Commission.", "group": "mock"}, {"id": "mock-26-6", "set": "mock26", "label": "9월 모의고사 26번", "num": "6", "text": "Although he passed away in 1903, his sons and successors continued his design philosophy.", "group": "mock"}, {"id": "mock-26-7", "set": "mock26", "label": "9월 모의고사 26번", "num": "7", "text": "In 1979, the National Park Service designated his home and office in Brookline, Massachusetts, as a National Historic Site to honor his legacy. *sumac: 옻나무", "group": "mock"}, {"id": "mock-27-1", "set": "mock27", "label": "9월 모의고사 27번", "num": "1", "text": "Ashwood Dunes Reforestation Event.", "group": "mock"}, {"id": "mock-27-2", "set": "mock27", "label": "9월 모의고사 27번", "num": "2", "text": "Join us for a meaningful morning at the annual Ashwood Dunes Reforestation.", "group": "mock"}, {"id": "mock-27-3", "set": "mock27", "label": "9월 모의고사 27번", "num": "3", "text": "Volunteers will plant native tree seedlings to help restore the local environment.", "group": "mock"}, {"id": "mock-27-4", "set": "mock27", "label": "9월 모의고사 27번", "num": "4", "text": "No special skills required, feel free to join us.", "group": "mock"}, {"id": "mock-27-5", "set": "mock27", "label": "9월 모의고사 27번", "num": "5", "text": "When and Where: September 5th, 2026, 8 a.m.-11 a.m.; Ashwood Dunes Wilderness.", "group": "mock"}, {"id": "mock-27-6", "set": "mock27", "label": "9월 모의고사 27번", "num": "6", "text": "Participation Fee: Free.", "group": "mock"}, {"id": "mock-27-7", "set": "mock27", "label": "9월 모의고사 27번", "num": "7", "text": "Rewards: All participants will get a commemorative badge.", "group": "mock"}, {"id": "mock-27-8", "set": "mock27", "label": "9월 모의고사 27번", "num": "8", "text": "Plant 5 trees: Receive a reusable water bottle.", "group": "mock"}, {"id": "mock-27-9", "set": "mock27", "label": "9월 모의고사 27번", "num": "9", "text": "Plant 10 or more trees: Receive a T-shirt.", "group": "mock"}, {"id": "mock-27-10", "set": "mock27", "label": "9월 모의고사 27번", "num": "10", "text": "Registration: Online registration is encouraged, but on-site sign-ups will be available on the day of the event.", "group": "mock"}, {"id": "mock-27-11", "set": "mock27", "label": "9월 모의고사 27번", "num": "11", "text": "Event Guidelines: Bring a hat and gloves; shovels and water will be prepared.", "group": "mock"}, {"id": "mock-27-12", "set": "mock27", "label": "9월 모의고사 27번", "num": "12", "text": "Follow instructions from the event staff.", "group": "mock"}, {"id": "mock-27-13", "set": "mock27", "label": "9월 모의고사 27번", "num": "13", "text": "For more information, please visit www.ashwooddunes.com.", "group": "mock"}, {"id": "mock-28-1", "set": "mock28", "label": "9월 모의고사 28번", "num": "1", "text": "2026 Footnote Dance Program.", "group": "mock"}, {"id": "mock-28-2", "set": "mock28", "label": "9월 모의고사 28번", "num": "2", "text": "The 2026 Footnote Dance Program is a modern dance program created for youth aged 13-18.", "group": "mock"}, {"id": "mock-28-3", "set": "mock28", "label": "9월 모의고사 28번", "num": "3", "text": "When: Wednesday, October 21st-Friday, October 23rd (5 p.m.-8 p.m. each day).", "group": "mock"}, {"id": "mock-28-4", "set": "mock28", "label": "9월 모의고사 28번", "num": "4", "text": "Where: Footnote Studio, 70 Elm Street.", "group": "mock"}, {"id": "mock-28-5", "set": "mock28", "label": "9월 모의고사 28번", "num": "5", "text": "Cost: $50 per workshop, or $120 for all three workshops.", "group": "mock"}, {"id": "mock-28-6", "set": "mock28", "label": "9월 모의고사 28번", "num": "6", "text": "Day 1 — Dance Lesson: Build creative confidence through guided movement exercises.", "group": "mock"}, {"id": "mock-28-7", "set": "mock28", "label": "9월 모의고사 28번", "num": "7", "text": "Day 2 — Performance Practice: Refine your performance skills and learn to connect with your audience.", "group": "mock"}, {"id": "mock-28-8", "set": "mock28", "label": "9월 모의고사 28번", "num": "8", "text": "Day 3 — Open Studio: Friends and family are invited to see what participants have created!", "group": "mock"}, {"id": "mock-28-9", "set": "mock28", "label": "9월 모의고사 28번", "num": "9", "text": "A free shuttle bus service will be provided for all participants and visitors.", "group": "mock"}, {"id": "mock-28-10", "set": "mock28", "label": "9월 모의고사 28번", "num": "10", "text": "Pre-registration is required.", "group": "mock"}, {"id": "mock-29-1", "set": "mock29", "label": "9월 모의고사 29번", "num": "1", "text": "Capitalism is not a system where cash is everywhere but rather one in which islands of cash exchange exist within oceans of cheap — or potentially cheap — natures.", "group": "mock"}, {"id": "mock-29-2", "set": "mock29", "label": "9월 모의고사 29번", "num": "2", "text": "Reproducing life within the cash nexus is expensive, and it grows more expensive over time.", "group": "mock"}, {"id": "mock-29-3", "set": "mock29", "label": "9월 모의고사 29번", "num": "3", "text": "Workers’ wages can be frozen, even rolled back, but in the end inequality leads to crises of the kind we’ve recently seen bring about populist protests in the United States and the United Kingdom.", "group": "mock"}, {"id": "mock-29-4", "set": "mock29", "label": "9월 모의고사 29번", "num": "4", "text": "Workers demand dignity, and their labor becomes expensive.", "group": "mock"}, {"id": "mock-29-5", "set": "mock29", "label": "9월 모의고사 29번", "num": "5", "text": "Production processes burn through an island, and energy is no longer cheap.", "group": "mock"}, {"id": "mock-29-6", "set": "mock29", "label": "9월 모의고사 29번", "num": "6", "text": "The climate changes, and crops can no longer grow as abundantly as they once did.", "group": "mock"}, {"id": "mock-29-7", "set": "mock29", "label": "9월 모의고사 29번", "num": "7", "text": "Frontiers are so important in these processes because they offer places where the new cheap things can be seized — and the cheap work of humans and other natures can be forcefully taken. *cash nexus: 현금 거래 관계", "group": "mock"}, {"id": "mock-30-1", "set": "mock30", "label": "9월 모의고사 30번", "num": "1", "text": "Some people are more likely to cheat and steal after purchasing “eco-friendly” products, probably because they feel licensed to do so since they morally account the “eco-friendly” choice as a “good” deed.", "group": "mock"}, {"id": "mock-30-2", "set": "mock30", "label": "9월 모의고사 30번", "num": "2", "text": "Moral licensing has also been observed in the context of cooperation for the good of the environment.", "group": "mock"}, {"id": "mock-30-3", "set": "mock30", "label": "9월 모의고사 30번", "num": "3", "text": "When people are reminded of deeds they have done that they know were harmful to the environment, they might be left with a feeling of “eco-guilt.” People who experience eco-guilt seek pro-environmental actions to compensate for this guilt and restore balance.", "group": "mock"}, {"id": "mock-30-4", "set": "mock30", "label": "9월 모의고사 30번", "num": "4", "text": "In their search for such a balance, people are inclined to believe in “quick-fixes,” because they want to re-establish the moral balance and escape the guilt as quickly and easily as possible.", "group": "mock"}, {"id": "mock-30-5", "set": "mock30", "label": "9월 모의고사 30번", "num": "5", "text": "In the same way that people may change their attitudes to reduce inconsistencies between attitudes and behavior, people may also change their evaluation of past environmentally burdening behaviors and future environmentally friendly behaviors.", "group": "mock"}, {"id": "mock-30-6", "set": "mock30", "label": "9월 모의고사 30번", "num": "6", "text": "For instance, people are more likely to sign a petition addressing environmental damage after viewing evidence of human-caused environmental damage. *petition: 청원서", "group": "mock"}, {"id": "mock-31-1", "set": "mock31", "label": "9월 모의고사 31번", "num": "1", "text": "Human geography is becoming unclear.", "group": "mock"}, {"id": "mock-31-2", "set": "mock31", "label": "9월 모의고사 31번", "num": "2", "text": "As people find themselves regularly on the move, we are experiencing a phase shift like when matter transitions from solid to liquid to gas: molecules heat up and loosen from one another, vibrating more rapidly.", "group": "mock"}, {"id": "mock-31-3", "set": "mock31", "label": "9월 모의고사 31번", "num": "3", "text": "One might even say that humans are becoming like particles in quantum physics, their velocity and location always in flux.", "group": "mock"}, {"id": "mock-31-4", "set": "mock31", "label": "9월 모의고사 31번", "num": "4", "text": "It would be nice to return to some form of stability, but that’s not how things work in a quantum world.", "group": "mock"}, {"id": "mock-31-5", "set": "mock31", "label": "9월 모의고사 31번", "num": "5", "text": "Instead, the complexity of today’s world makes it increasingly difficult to settle permanently anywhere.", "group": "mock"}, {"id": "mock-31-6", "set": "mock31", "label": "9월 모의고사 31번", "num": "6", "text": "Highly paid digital nomads and billionaires with multiple passports as well as migratory workers are all part of the diverse and growing global demographic of quantum people. *quantum physics: 양자 물리학 **velocity: 속도 ***flux: 끊임없는 변화", "group": "mock"}, {"id": "mock-32-1", "set": "mock32", "label": "9월 모의고사 32번", "num": "1", "text": "Of the cognitive motivations, the most fundamental one encourages people to understand their environment to predict what is going to happen in case of uncertainties.", "group": "mock"}, {"id": "mock-32-2", "set": "mock32", "label": "9월 모의고사 32번", "num": "2", "text": "Most important, people prefer to develop meanings that are shared with other people.", "group": "mock"}, {"id": "mock-32-3", "set": "mock32", "label": "9월 모의고사 32번", "num": "3", "text": "For example, if in a given year more people accept offers of admission than a college expects, quite a few students end up living in dorm lounges or campus hotels.", "group": "mock"}, {"id": "mock-32-4", "set": "mock32", "label": "9월 모의고사 32번", "num": "4", "text": "It is easy to understand why living in the lounge is problematic (no closet, for one thing).", "group": "mock"}, {"id": "mock-32-5", "set": "mock32", "label": "9월 모의고사 32번", "num": "5", "text": "But what is wrong with a room at campus hotels?", "group": "mock"}, {"id": "mock-32-6", "set": "mock32", "label": "9월 모의고사 32번", "num": "6", "text": "After all, students in a hotel get private bathrooms, their own TV, and larger rooms.", "group": "mock"}, {"id": "mock-32-7", "set": "mock32", "label": "9월 모의고사 32번", "num": "7", "text": "In fact, living in those hotels is problematic because the student residents are not a part of a stable group with people who will be their neighbors for the year; they must wait in uncertainty before finding their social niche.", "group": "mock"}, {"id": "mock-32-8", "set": "mock32", "label": "9월 모의고사 32번", "num": "8", "text": "The uncertainty itself is the problem.", "group": "mock"}, {"id": "mock-32-9", "set": "mock32", "label": "9월 모의고사 32번", "num": "9", "text": "People lack a shared social understanding, normally developed from membership in a stable group.", "group": "mock"}, {"id": "mock-33-1", "set": "mock33", "label": "9월 모의고사 33번", "num": "1", "text": "Psychological theories across the field agree on the importance of grieving our losses, from the highly personal through to the broadly collective.", "group": "mock"}, {"id": "mock-33-2", "set": "mock33", "label": "9월 모의고사 33번", "num": "2", "text": "Grief is a dynamic emotional process essential to consciousness.", "group": "mock"}, {"id": "mock-33-3", "set": "mock33", "label": "9월 모의고사 33번", "num": "3", "text": "At a psychological level, it supports us to both face into our own and others’ vulnerability, transience and mortality, and to repair life energy after significant loss.", "group": "mock"}, {"id": "mock-33-4", "set": "mock33", "label": "9월 모의고사 33번", "num": "4", "text": "Grief work honours the loss, the sadness and the experience of diminishment or absence, while also setting up the ground for self-transformation and the continuation of life.", "group": "mock"}, {"id": "mock-33-5", "set": "mock33", "label": "9월 모의고사 33번", "num": "5", "text": "Psychotherapist Fran Weller describes grief work as “an act of devotion, rooted in love and compassion” that requires “an ongoing practice of deepening, attending and listening.” When we grieve for what is lost, it clears the way towards a strengthening of love and commitment for what remains.", "group": "mock"}, {"id": "mock-33-6", "set": "mock33", "label": "9월 모의고사 33번", "num": "6", "text": "In time this may build a desire to make good from the loss by repairing as many damages as we can and/or compensating for them.", "group": "mock"}, {"id": "mock-33-7", "set": "mock33", "label": "9월 모의고사 33번", "num": "7", "text": "Grief can make us both very sad and very motivated to act.", "group": "mock"}, {"id": "mock-34-1", "set": "mock34", "label": "9월 모의고사 34번", "num": "1", "text": "When we focus on the obvious aspects of media, we miss the changes that accumulate over time but are not apparent day to day.", "group": "mock"}, {"id": "mock-34-2", "set": "mock34", "label": "9월 모의고사 34번", "num": "2", "text": "Most of us notice the obvious aspects of a new medium or technology while missing the more subtle aspects.", "group": "mock"}, {"id": "mock-34-3", "set": "mock34", "label": "9월 모의고사 34번", "num": "3", "text": "Take, for example, the microwave oven.", "group": "mock"}, {"id": "mock-34-4", "set": "mock34", "label": "9월 모의고사 34번", "num": "4", "text": "It was introduced in the early 1980s and revolutionized food preparation.", "group": "mock"}, {"id": "mock-34-5", "set": "mock34", "label": "9월 모의고사 34번", "num": "5", "text": "Traditionally, one person spent the better part of an afternoon fixing an evening meal for a family.", "group": "mock"}, {"id": "mock-34-6", "set": "mock34", "label": "9월 모의고사 34번", "num": "6", "text": "Now, it was possible to prepare foods very quickly, and this shortening of preparation time was liberating for the cooks in the family, most of whom tended to be women.", "group": "mock"}, {"id": "mock-34-7", "set": "mock34", "label": "9월 모의고사 34번", "num": "7", "text": "But the short-term, obvious implications of greater convenience made it easy to overlook the long-term implications of no longer having one person fix food for the family to eat together at an evening meal.", "group": "mock"}, {"id": "mock-34-8", "set": "mock34", "label": "9월 모의고사 34번", "num": "8", "text": "As time went on, fewer and fewer families sat down together to eat dinner.", "group": "mock"}, {"id": "mock-34-9", "set": "mock34", "label": "9월 모의고사 34번", "num": "9", "text": "Meals that took a long time to prepare became a luxury of the past, except perhaps for special occasions.", "group": "mock"}, {"id": "mock-34-10", "set": "mock34", "label": "9월 모의고사 34번", "num": "10", "text": "The effects of the microwave oven on family life were not anticipated and would have been difficult to foresee.", "group": "mock"}, {"id": "mock-35-1", "set": "mock35", "label": "9월 모의고사 35번", "num": "1", "text": "Digital twins are digital replicas of assets or activities using modeling and sensors to create digital representations.", "group": "mock"}, {"id": "mock-35-2", "set": "mock35", "label": "9월 모의고사 35번", "num": "2", "text": "Digital twins are not new; engineering teams in various industries have used 3D renderings of computer-aided design models, asset models, and process simulations for years.", "group": "mock"}, {"id": "mock-35-3", "set": "mock35", "label": "9월 모의고사 35번", "num": "3", "text": "However, faster wireless networks and the resulting availability of real-time data enable much more detailed and dynamic digital representations.", "group": "mock"}, {"id": "mock-35-4", "set": "mock35", "label": "9월 모의고사 35번", "num": "4", "text": "When sensors collect data from a connected device, the sensor data can be used to continuously update the digital twin.", "group": "mock"}, {"id": "mock-35-5", "set": "mock35", "label": "9월 모의고사 35번", "num": "5", "text": "The digital twin becomes a real-time accurate copy of a physical object’s properties and states.", "group": "mock"}, {"id": "mock-35-6", "set": "mock35", "label": "9월 모의고사 35번", "num": "6", "text": "For instance, digital twins of physical assets such as power-generation turbines, jet engines, and train engines are becoming common when the assets are very valuable and when downtime would be very costly. *replica: 복제본 **downtime: 비가동 시간", "group": "mock"}, {"id": "mock-36-1", "set": "mock36", "label": "9월 모의고사 36번", "num": "1", "text": "The ability to select a set of surroundings suitable for foraging, shelter from predators, and the availability of mates is one of the most important determinants of biological success — measured as survival to reproductive age and the production of offspring.", "group": "mock"}, {"id": "mock-36-2", "set": "mock36", "label": "9월 모의고사 36번", "num": "2", "text": "Many studies have shown that not only do animals have a remarkable ability to seek out the best available locations for the necessities of life, but that they are able to anticipate how a setting will serve their future needs.", "group": "mock"}, {"id": "mock-36-3", "set": "mock36", "label": "9월 모의고사 36번", "num": "3", "text": "For example, the black-throated green warbler, a small songbird that nests in spruce forests of eastern North America, establishes territories preferentially among the red spruce trees early in the summer months, even though these trees offer less food than the neighboring white spruce trees.", "group": "mock"}, {"id": "mock-36-4", "set": "mock36", "label": "9월 모의고사 36번", "num": "4", "text": "Later, though, when nests are built and hungry baby birds need nourishment, it is the red spruce forest that offers the easier pickings.", "group": "mock"}, {"id": "mock-36-5", "set": "mock36", "label": "9월 모의고사 36번", "num": "5", "text": "Somehow, the warbler has been guided to settle in locations that will suit its future parenting needs better than its present ones.", "group": "mock"}, {"id": "mock-37-1", "set": "mock37", "label": "9월 모의고사 37번", "num": "1", "text": "Language is a manifestation of culture.", "group": "mock"}, {"id": "mock-37-2", "set": "mock37", "label": "9월 모의고사 37번", "num": "2", "text": "At different language acquisition stages, children do not learn language per se; rather they learn the various patterns and styles of language interaction that enable them to function as competent communicators in different situational contexts.", "group": "mock"}, {"id": "mock-37-3", "set": "mock37", "label": "9월 모의고사 37번", "num": "3", "text": "They develop a culture-specific communication style that is, for example, direct and explicit in individualistic cultures or indirect and implicit in collectivistic cultures.", "group": "mock"}, {"id": "mock-37-4", "set": "mock37", "label": "9월 모의고사 37번", "num": "4", "text": "Examples of words linked with the direct style are categorical words like absolutely, certainly, or positively.", "group": "mock"}, {"id": "mock-37-5", "set": "mock37", "label": "9월 모의고사 37번", "num": "5", "text": "By contrast, the cultural assumptions of interdependence and harmony require that collectivists limit themselves to implicit and even ambiguous use of words, using terms like maybe, perhaps, or probably.", "group": "mock"}, {"id": "mock-37-6", "set": "mock37", "label": "9월 모의고사 37번", "num": "6", "text": "The English language is the only language in the world that spells I with a capital letter.", "group": "mock"}, {"id": "mock-37-7", "set": "mock37", "label": "9월 모의고사 37번", "num": "7", "text": "This phenomenon may reflect the fact that the roots of individualism are in England.", "group": "mock"}, {"id": "mock-37-8", "set": "mock37", "label": "9월 모의고사 37번", "num": "8", "text": "There is no Japanese equivalent for the English I.", "group": "mock"}, {"id": "mock-37-9", "set": "mock37", "label": "9월 모의고사 37번", "num": "9", "text": "Different words are used to refer to the self, depending on the social situation, the speaker’s gender, age, and the other social attributes relative to the listener.", "group": "mock"}, {"id": "mock-38-1", "set": "mock38", "label": "9월 모의고사 38번", "num": "1", "text": "Environmental psychologists make a distinction between the physical measurement of density (how many people are in a particular space) and crowding (the psychological feeling of not having enough space).", "group": "mock"}, {"id": "mock-38-2", "set": "mock38", "label": "9월 모의고사 38번", "num": "2", "text": "Usually, high density is needed for the phenomenon of crowding, which makes people experience sensory overload, a lack of control, and rising stress and anxiety.", "group": "mock"}, {"id": "mock-38-3", "set": "mock38", "label": "9월 모의고사 38번", "num": "3", "text": "However, some psychologists see crowding as neutral rather than invariably negative, and believe that people’s moods and behaviors intensify as density increases.", "group": "mock"}, {"id": "mock-38-4", "set": "mock38", "label": "9월 모의고사 38번", "num": "4", "text": "So if an individual is looking forward to a concert, say, the feeling of crowding enhances their enjoyment of the performance.", "group": "mock"}, {"id": "mock-38-5", "set": "mock38", "label": "9월 모의고사 38번", "num": "5", "text": "But if they are dreading an event, crowding will make the person’s experience of it even worse.", "group": "mock"}, {"id": "mock-38-6", "set": "mock38", "label": "9월 모의고사 38번", "num": "6", "text": "Put into a community setting, crowding may accentuate the dominant behavior — an aggressive group may turn violent as density rises.", "group": "mock"}, {"id": "mock-38-7", "set": "mock38", "label": "9월 모의고사 38번", "num": "7", "text": "Conversely, creating positive social spaces such as parks and pedestrian areas in high-density urban environments may help to lift the general mood and defuse tension.", "group": "mock"}, {"id": "mock-39-1", "set": "mock39", "label": "9월 모의고사 39번", "num": "1", "text": "Exclusion is a state that is ignored by the organization psychologists.", "group": "mock"}, {"id": "mock-39-2", "set": "mock39", "label": "9월 모의고사 39번", "num": "2", "text": "Therefore, it is possible that precautions regarding organizational exclusion are not taken.", "group": "mock"}, {"id": "mock-39-3", "set": "mock39", "label": "9월 모의고사 39번", "num": "3", "text": "Individuals react to organizational exclusion by trying to strengthen their basic needs, which are threatened.", "group": "mock"}, {"id": "mock-39-4", "set": "mock39", "label": "9월 모의고사 39번", "num": "4", "text": "Positive social behaviors develop belonging and self-respect.", "group": "mock"}, {"id": "mock-39-5", "set": "mock39", "label": "9월 모의고사 39번", "num": "5", "text": "The likelihood that individuals who try to adapt to positive social behaviors will experience organizational exclusion decreases.", "group": "mock"}, {"id": "mock-39-6", "set": "mock39", "label": "9월 모의고사 39번", "num": "6", "text": "However, individuals may be faced with more exclusion when they cannot adapt to a group.", "group": "mock"}, {"id": "mock-39-7", "set": "mock39", "label": "9월 모의고사 39번", "num": "7", "text": "When excluded individuals grow away from communication and social activities, their contribution to the organization they are in may decrease.", "group": "mock"}, {"id": "mock-39-8", "set": "mock39", "label": "9월 모의고사 39번", "num": "8", "text": "When this situation is not avoided, exclusion increases even more and strongly affects the performance of the employee in a negative way.", "group": "mock"}, {"id": "mock-39-9", "set": "mock39", "label": "9월 모의고사 39번", "num": "9", "text": "Precautions need to be taken regarding organizational exclusion, which is very important for business.", "group": "mock"}, {"id": "mock-40-1", "set": "mock40", "label": "9월 모의고사 40번", "num": "1", "text": "Our adult brains retain a preference for perpetuating good, fair behavior.", "group": "mock"}, {"id": "mock-40-2", "set": "mock40", "label": "9월 모의고사 40번", "num": "2", "text": "Simply perceiving ourselves as people who do good deeds and behaving accordingly motivates us to do greater good in the future.", "group": "mock"}, {"id": "mock-40-3", "set": "mock40", "label": "9월 모의고사 40번", "num": "3", "text": "In one paid study of one hundred college students, subjects who wrote down a list of past good deeds and were then asked to donate money to a charity gave, on average, over half the earnings they’d made from the study — almost twice as much as those who had been instructed to recall previous bad deeds.", "group": "mock"}, {"id": "mock-40-4", "set": "mock40", "label": "9월 모의고사 40번", "num": "4", "text": "In addition, subjects who’d taken pains to describe not only how they’d been nice to others but how people responded were likely to donate significantly less than those who focused purely on the actions themselves.", "group": "mock"}, {"id": "mock-40-5", "set": "mock40", "label": "9월 모의고사 40번", "num": "5", "text": "In other words, people who seemed concerned about appearances (e.g., the impact of their good deed, as much as the deed itself) were less generous than those who cared more about doing good for its own sake. *perpetuate: 영속시키다", "group": "mock"}, {"id": "mock-41-1", "set": "mock41", "label": "9월 모의고사 41~42번", "num": "1", "text": "The concept of “choice architecture,” popularized in behavioral economics, highlights how the design of the environment in which choices are made can significantly influence the decisions people make.", "group": "mock"}, {"id": "mock-41-2", "set": "mock41", "label": "9월 모의고사 41~42번", "num": "2", "text": "Algorithms are, in essence, sophisticated architects of our digital environments.", "group": "mock"}, {"id": "mock-41-3", "set": "mock41", "label": "9월 모의고사 41~42번", "num": "3", "text": "By curating what we see, what we are recommended, and what options are presented to us, they subtly, and sometimes not so subtly, nudge us towards particular paths.", "group": "mock"}, {"id": "mock-41-4", "set": "mock41", "label": "9월 모의고사 41~42번", "num": "4", "text": "While nudges can be used for beneficial purposes, such as encouraging healthier habits, they also carry the potential for manipulation, particularly when the underlying objectives of the architects are not aligned with the well-being or autonomy of the individual.", "group": "mock"}, {"id": "mock-41-5", "set": "mock41", "label": "9월 모의고사 41~42번", "num": "5", "text": "The question then becomes: how can we cultivate and protect our human agency in an increasingly algorithmic world?", "group": "mock"}, {"id": "mock-41-6", "set": "mock41", "label": "9월 모의고사 41~42번", "num": "6", "text": "It requires a conscious effort to maintain critical engagement with the technologies we use.", "group": "mock"}, {"id": "mock-41-7", "set": "mock41", "label": "9월 모의고사 41~42번", "num": "7", "text": "It means actively seeking out diverse perspectives, challenging algorithmic recommendations, and making deliberate choices that go against the predicted grain.", "group": "mock"}, {"id": "mock-41-8", "set": "mock41", "label": "9월 모의고사 41~42번", "num": "8", "text": "It involves cultivating a healthy skepticism towards the seemingly objective outputs of algorithms and remembering that these systems are designed by humans with specific goals, and that their data is a reflection of past realities, not necessarily a prescription for future flourishing. *nudge: 가볍게 자극하다", "group": "mock"}, {"id": "mock-43-1", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "1", "text": "Ridge was a high school student who wanted to major in music in college.", "group": "mock"}, {"id": "mock-43-2", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "2", "text": "For weeks, on his balcony, every night he listened to a man playing the guitar in the apartment across the courtyard.", "group": "mock"}, {"id": "mock-43-3", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "3", "text": "Although the songs the man played were all new to Ridge, he somehow managed to attach his own made-up lyrics to them.", "group": "mock"}, {"id": "mock-43-4", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "4", "text": "One night, Ridge slid open the balcony door and stepped outside.", "group": "mock"}, {"id": "mock-43-5", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "5", "text": "He told his mom he was going out to the balcony to do his homework.", "group": "mock"}, {"id": "mock-43-6", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "6", "text": "The man was playing the guitar on his balcony as usual and Ridge started to mindlessly follow the rhythm.", "group": "mock"}, {"id": "mock-43-7", "set": "mock4

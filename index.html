3", "label": "9월 모의고사 43~45번", "num": "7", "text": "While Ridge was singing along to the music, the man suddenly stopped playing.", "group": "mock"}, {"id": "mock-43-8", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "8", "text": "He had never stopped in the middle of a song, so naturally Ridge looked in his direction.", "group": "mock"}, {"id": "mock-43-9", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "9", "text": "The man held up his index finger as if to say, “Hold on.” He lifted one sheet of paper, and Ridge narrowed his eyes to get a good look at what was written on it.", "group": "mock"}, {"id": "mock-43-10", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "10", "text": "His phone number and “Text me” were written on the sheet.", "group": "mock"}, {"id": "mock-43-11", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "11", "text": "Then he flipped the paper over and wrote, “I have a question.” Curious about the man’s question, and wondering why he had asked for a text instead of a call, Ridge pulled out his phone and entered the number.", "group": "mock"}, {"id": "mock-43-12", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "12", "text": "He typed, “What’s your question?” The man texted, “I want to know how you’re singing lyrics to my songs when I haven’t even added lyrics to them yet.” Ridge was greatly surprised.", "group": "mock"}, {"id": "mock-43-13", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "13", "text": "Why hadn’t he thought the man could see him sitting out there?", "group": "mock"}, {"id": "mock-43-14", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "14", "text": "He had never thought the man had noticed him singing along to his music.", "group": "mock"}, {"id": "mock-43-15", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "15", "text": "The man sent another message asking, “Will you send them to me?” After reading the man’s message asking for his lyrics, Ridge hesitated.", "group": "mock"}, {"id": "mock-43-16", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "16", "text": "Ridge loved writing lyrics, but he had never shared anything he’d written with anyone.", "group": "mock"}, {"id": "mock-43-17", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "17", "text": "Eventually, he wrote down one of his favorite lyrics and sent it to him.", "group": "mock"}, {"id": "mock-43-18", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "18", "text": "A few days later, a new message came from the man.", "group": "mock"}, {"id": "mock-43-19", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "19", "text": "He wanted to use Ridge’s lyrics for his new album.", "group": "mock"}, {"id": "mock-43-20", "set": "mock43", "label": "9월 모의고사 43~45번", "num": "20", "text": "It turned out he was a deaf guitarist and songwriter in a band called Brennan’s Band.", "group": "mock"}];
const $=s=>document.querySelector(s);

let pool=[];
let index=0;
let current=null;
let history=[];
let historyPos=-1;

const saved=JSON.parse(localStorage.getItem("eng2_reader_pref")||"{}");
if(saved.scope) $("#scope").value=saved.scope;
if(saved.mode) $("#mode").value=saved.mode;
if(saved.order) $("#order").value=saved.order;

function savePref(){
  localStorage.setItem("eng2_reader_pref",JSON.stringify({
    scope:$("#scope").value,mode:$("#mode").value,order:$("#order").value
  }));
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function tokens(s){return s.match(/[\p{L}\p{N}]+(?:[’'][\p{L}\p{N}]+)?|[^\s\p{L}\p{N}]/gu)||[];}

function getPool(){
  const sc=$("#scope").value;
  if(sc==="all") return DATA.slice();
  if(sc==="textbook") return DATA.filter(x=>x.group==="textbook");
  if(sc==="mock") return DATA.filter(x=>x.group==="mock");
  return DATA.filter(x=>x.set===sc);
}

function renderPrompt(item){
  const mode=$("#mode").value, ts=tokens(item.text);
  if(mode.startsWith("cloze")){
    const rate=Number(mode.replace("cloze",""))/100;
    const inds=ts.map((t,i)=>/[\p{L}\p{N}]/u.test(t)?i:null).filter(i=>i!==null);
    inds.sort(()=>Math.random()-.5);
    const hide=new Set(inds.slice(0,Math.max(1,Math.round(inds.length*rate))));
    return ts.map((t,i)=>hide.has(i)?'<span class="blank">_____</span>':esc(t))
      .join(" ").replace(/\s+([,.;:!?])/g,"$1").replace(/([“‘(])\s+/g,"$1");
  }
  if(mode==="initial"){
    return ts.map(t=>/[\p{L}\p{N}]/u.test(t)?esc(t[0])+'___':esc(t))
      .join(" ").replace(/\s+([,.;:!?])/g,"$1").replace(/([“‘(])\s+/g,"$1");
  }
  const ws=item.text.split(/\s+/);
  const n=Math.min(5,Math.max(2,Math.ceil(ws.length*.16)));
  return esc(ws.slice(0,n).join(" ")+" …");
}

function rebuildSentenceSelect(){
  pool=getPool();
  const sel=$("#sentenceSelect");
  sel.innerHTML=pool.map((x,i)=>{
    const preview=x.text.replace(/\s+/g," ").slice(0,70);
    return `<option value="${i}">${esc(x.label)} · ${esc(x.num)} — ${esc(preview)}${x.text.length>70?"…":""}</option>`;
  }).join("");
  $("#count").textContent=`현재 범위 ${pool.length}문장`;
}

function pushHistory(id){
  if(historyPos < history.length-1) history=history.slice(0,historyPos+1);
  if(history[history.length-1]!==id) history.push(id);
  historyPos=history.length-1;
}

function setCurrent(item, opts={}){
  if(!item)return;
  current=item;
  const idx=pool.findIndex(x=>x.id===item.id);
  if(idx>=0) index=idx;

  if(opts.pushHistory!==false) pushHistory(item.id);

  $("#meta").textContent=current.label+" · "+current.num;
  $("#pos").textContent=`${index+1} / ${pool.length}`;
  $("#prompt").innerHTML=renderPrompt(current);
  $("#answerText").textContent=current.text;
  $("#answerBox").classList.remove("show");
  $("#answerBtn").textContent="답 보기";
  if(idx>=0) $("#sentenceSelect").value=String(idx);
}

function resetCurrent(){
  rebuildSentenceSelect();
  history=[];
  historyPos=-1;
  index=0;
  if(!pool.length)return;
  const item=$("#order").value==="random"
    ? pool[Math.floor(Math.random()*pool.length)]
    : pool[0];
  setCurrent(item);
}

function toggleAnswer(){
  const box=$("#answerBox");
  box.classList.toggle("show");
  $("#answerBtn").textContent=box.classList.contains("show")?"답 숨기기":"답 보기";
}

function next(){
  if(!pool.length)return;

  // If user went back in random history, next walks forward through that history first.
  if($("#order").value==="random" && historyPos < history.length-1){
    historyPos++;
    const item=pool.find(x=>x.id===history[historyPos]) || DATA.find(x=>x.id===history[historyPos]);
    setCurrent(item,{pushHistory:false});
    return;
  }

  let item;
  if($("#order").value==="seq"){
    index=(index+1)%pool.length;
    item=pool[index];
  }else{
    if(pool.length===1) item=pool[0];
    else{
      do{ item=pool[Math.floor(Math.random()*pool.length)]; }
      while(item.id===current?.id);
    }
  }
  setCurrent(item);
}

function prev(){
  if(!pool.length)return;

  if($("#order").value==="random"){
    if(historyPos>0){
      historyPos--;
      const item=pool.find(x=>x.id===history[historyPos]) || DATA.find(x=>x.id===history[historyPos]);
      setCurrent(item,{pushHistory:false});
    }
    return;
  }

  index=(index-1+pool.length)%pool.length;
  setCurrent(pool[index]);
}

function jumpToSelected(){
  const i=Number($("#sentenceSelect").value);
  if(Number.isFinite(i) && pool[i]) setCurrent(pool[i]);
}

function openFullText(){
  const groups=[];
  const byLabel=new Map();
  for(const x of pool){
    if(!byLabel.has(x.label)){byLabel.set(x.label,[]);groups.push(x.label);}
    byLabel.get(x.label).push(x);
  }

  let out="";
  for(const label of groups){
    out+=`<h2 class="groupTitle">${esc(label)}</h2>`;
    for(const x of byLabel.get(label)){
      const cur=x.id===current?.id?" current":"";
      out+=`<div class="fullRow${cur}" data-id="${esc(x.id)}">
        <div class="fullNum">${esc(x.num)}</div>
        <div class="fullSentence">${esc(x.text)}</div>
      </div>`;
    }
  }
  $("#fullTitle").textContent=`원문 전체 보기 · ${$("#scope").selectedOptions[0].text}`;
  $("#fullText").innerHTML=out;

  // Tap a sentence in full text to jump directly to it.
  $("#fullText").querySelectorAll(".fullRow").forEach(row=>{
    row.addEventListener("click",()=>{
      const item=pool.find(x=>x.id===row.dataset.id);
      if(item){
        setCurrent(item);
        $("#fullDialog").close();
      }
    });
  });

  $("#fullDialog").showModal();

  const cur=$("#fullText .current");
  if(cur) setTimeout(()=>cur.scrollIntoView({block:"center"}),50);
}

$("#answerBtn").onclick=toggleAnswer;
$("#nextBtn").onclick=next;
$("#prevBtn").onclick=prev;
$("#sentenceSelect").onchange=jumpToSelected;
$("#fullBtn").onclick=openFullText;
$("#closeFullBtn").onclick=()=>$("#fullDialog").close();

["scope","mode","order"].forEach(id=>{
  $("#"+id).addEventListener("change",()=>{
    savePref();
    if(id==="scope" || id==="order") resetCurrent();
    else if(current) setCurrent(current,{pushHistory:false});
  });
});

document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();toggleAnswer();}
  if(e.key==="ArrowRight"){next();}
  if(e.key==="ArrowLeft"){prev();}
});

resetCurrent();
</script>
</body>
</html>
